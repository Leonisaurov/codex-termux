[package]
name = "codex-code-mode-host"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "codex-code-mode-host"
path = "src/main.rs"

[lib]
doctest = false
name = "codex_code_mode_host"
path = "src/lib.rs"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
axum = { workspace = true, features = ["http1", "tokio", "ws"] }
clap = { workspace = true, features = ["derive"] }
codex-code-mode-protocol = { workspace = true }
codex-code-mode-runtime = { workspace = true }
codex-otel = { workspace = true }
codex-otel-trace-websocket = { workspace = true }
codex-protocol = { workspace = true }
futures = { workspace = true }
prost = "0.14.3"
serde_json = { workspace = true }
tokio = { workspace = true, features = ["io-std", "io-util", "macros", "net", "process", "rt", "sync", "time"] }
tokio-stream = { workspace = true }
tokio-util = { workspace = true, features = ["rt"] }
tonic = { workspace = true, features = ["router", "transport"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4"] }

[dev-dependencies]
codex-code-mode = { workspace = true }
codex-utils-cargo-bin = { workspace = true }
pretty_assertions = { workspace = true }
tempfile = { workspace = true }

# CODEX-TERMUX-ANDROID-PATCH: Build OpenSSL from source for Android builds. This
# crate's own graph does not contain openssl-sys (only codex-core pulls it in, via
# codex-cli), so this [target.*] section exists to unify the vendored feature
# across builds that include this crate. It must live on a real package manifest:
# the workspace root Cargo.toml is a virtual manifest and cargo rejects
# [target.*] sections.
[target.aarch64-linux-android.dependencies]
openssl-sys = { workspace = true, features = ["vendored"] }
